name: Technologydata prototype CI

on:
  push:
    branches: [prototype-2]
  pull_request:
    branches: [prototype-2]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7


    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"

    - name: Cache Python dependencies
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    - name: Install package and dependencies
      run: |
        python -m pip install uv
        uv lock
        uv sync

    - name: Run unit tests
      run: |
        uv run pytest

  security-audit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Check if uv.lock changed
      uses: dorny/paths-filter@v4
      id: changes
      with:
        filters: |
          lockfile:
            - 'uv.lock'

    - name: Set up Python
      if: steps.changes.outputs.lockfile == 'true'
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"

    - name: Install uv
      if: steps.changes.outputs.lockfile == 'true'
      run: python -m pip install uv

    - name: Security audit with pip-audit
      if: steps.changes.outputs.lockfile == 'true'
      run: |
        uv export --format requirements.txt -o requirements-audit.txt
        uv run pip-audit -r requirements-audit.txt
